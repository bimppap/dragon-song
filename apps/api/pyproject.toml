[project]
name = "dragon-song-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg2-binary",
    "python-dotenv",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "pillow>=12.3.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "apscheduler>=3.11.3",
]

[project.scripts]
dev = "app.dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
